name = "laris-api"
main = "src/index.tsx"
compatibility_date = "2026-08-01"
compatibility_flags = ["global_fetch_strictly_public"]

# Secrets are set with `wrangler secret put`, never written here.
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# With neither set, the API serves the built-in fixture merchant so a fresh
# clone runs with no credentials at all.

[observability]
enabled = true

# Merchant Sites are served on their own hostnames, one route each — see the
# custom domains below. There is no wildcard subdomain to fall back on:
# `laris.my` belongs to somebody else, and the plan that assumed otherwise was
# written before anyone checked. Until Cloudflare for SaaS custom hostnames are
# configured, a site without its own domain is reachable at /site/<slug>.
