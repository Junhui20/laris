name = "laris-api"
main = "src/index.tsx"
compatibility_date = "2026-08-01"

# Declaring a route otherwise turns the workers.dev host off, and that host is
# how we reach the Worker while a custom domain's certificate is still issuing.
# Both hostnames serve the same page; the canonical link tag names the
# merchant's domain, so only one of them is the address anyone should keep.
workers_dev = true

# Secrets are set with `wrangler secret put`, never written here.
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# With neither set, the API serves the built-in fixture merchant so a fresh
# clone runs with no credentials at all.

# Merchant photographs, served from the same origin as the site so a Business
# Profile never has to carry a hostname. Requests that match a file here are
# served straight from the edge; everything else reaches the Worker.
[assets]
directory = "./public"

# Production by default. `pnpm dev:api` overrides ENVIRONMENT, so a deploy that
# forgets to think about it is locked down rather than open — the safe direction
# for the mistake to fall in.
[vars]
ENVIRONMENT = "production"
# Serve the built-in fixture Merchant in production. A deliberate phase-00
# decision for a single real merchant whose Profile is hand-maintained, not an
# accident of Supabase being unconfigured. Remove it when #3 lands.
ALLOW_FIXTURE = "true"

[observability]
enabled = true

# Merchant Sites are served on their own hostnames. One merchant, one domain,
# added here by hand — Cloudflare for SaaS custom hostnames are what makes this
# scale, and are not worth standing up for a single site.
[[routes]]
pattern = "pangkormyhomestay.top"
custom_domain = true

# People type it. A hostname that answers nothing reads as a dead business.
[[routes]]
pattern = "www.pangkormyhomestay.top"
custom_domain = true
