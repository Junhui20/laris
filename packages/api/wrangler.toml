name = "laris-api"
main = "src/index.tsx"
compatibility_date = "2026-08-01"

# Secrets are set with `wrangler secret put`, never written here.
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# With neither set, the API serves the built-in fixture merchant so a fresh
# clone runs with no credentials at all.

# Merchant photographs, served from the same origin as the site so a Business
# Profile never has to carry a hostname. Requests that match a file here are
# served straight from the edge; everything else reaches the Worker.
[assets]
directory = "./public"

[observability]
enabled = true

# Merchant Sites are served on their own hostnames. Until Cloudflare for SaaS
# custom hostnames are configured, a site is reachable at /site/<slug>.
# [[routes]]
# pattern = "*.laris.my/*"
# zone_name = "laris.my"
